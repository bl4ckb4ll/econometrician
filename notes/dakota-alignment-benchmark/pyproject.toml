[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dakota-alignment-benchmark"
version = "0.1.0"
description = "Auditable Dodge Dakota alignment benchmark primitives"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

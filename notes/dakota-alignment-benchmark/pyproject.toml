[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dakota-alignment-benchmark"
version = "0.1.0"
description = "Auditable Dodge Dakota alignment benchmark primitives"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

name: tests

on:
  push:
    branches:
      - wasserman-chi-square
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "expected=$EXPECTED_HEAD"
          echo "actual=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install Dakota benchmark test dependencies
        run: python3 -m pip install --disable-pip-version-check './notes/dakota-alignment-benchmark[test]'
      - name: Run tests
        run: python3 -m unittest -v
      - name: Run Dakota failure-audit and uncertainty tests
        run: ./notes/dakota-alignment-benchmark/run_checks.sh
      - name: Run Dakota scalar and stage reconstruction tests
        working-directory: notes/dakota-caster-scalar-slice
        run: python3 -m unittest -v test_scalar_slice.py test_stage_reconstruction.py

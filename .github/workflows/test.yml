name: tests

on:
  push:
    branches:
      - wasserman-chi-square
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "expected=$EXPECTED_HEAD"
          echo "actual=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run tests
        run: python3 -m unittest -v


  low-precision-jacobian:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "expected=$EXPECTED_HEAD"
          echo "actual=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Check out pinned ICK numeric types
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ick
          ref: 90c003e042fa967872ed3408c25c55ec59315b9b
          path: _ick

      - name: Provision the qualified native ICK compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@c789bb621ca9c5fb1a9bec07eb95cc670efb65f7

      - name: Build the diagnostic through ICK
        run: make -f notes/dakota-alignment-benchmark/diagnostics/Makefile build ICK_CC="${{ steps.ick.outputs.compiler }}"

      - name: Run real Jacobian residual sweep
        run: |
          set -euxo pipefail
          /tmp/low-precision-jacobian \
            notes/dakota-alignment-benchmark/data/candidate_large_jacobian.csv \
            | tee /tmp/low-precision-jacobian.txt
          grep -qx 'report_complete' /tmp/low-precision-jacobian.txt
          {
            echo '### Low-precision Jacobian residuals'
            echo
            echo 'All arithmetic in the matrix multiply/solve is binary32 after storage decode.'
            echo 'Residual magnitude is diagnostic only.'
            echo
            echo '```text'
            grep -E '^(summary|diagnostic|report_complete)' \
              /tmp/low-precision-jacobian.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full residual report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: low-precision-jacobian-residuals
          path: /tmp/low-precision-jacobian.txt
